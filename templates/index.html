{% extends "base.html" %}
{% block title %}
    Domenico's Web Portfolio
{% endblock %}
{% block content %}
<section>
    <h2>Weekly Work</h2>
    <!-- Each week you add a link here to that week's page or feature. -->
    <ul class="weekly-list">
        {% for item in weekly_work %}
            <li data-week="W{{ item.week }}"><a href="{{ item.url }}">{{ item.title }}</a></li>
        {% else %}
            <li data-week="W1">live site launched.</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
